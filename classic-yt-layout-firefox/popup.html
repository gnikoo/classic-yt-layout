<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Classic Volume</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      background: #0f0f0f;
      color: #f1f1f1;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      user-select: none;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid #272727;
    }
    .header-icon {
      width: 28px;
      height: 28px;
      background: #ff3232;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .header-icon svg { width: 16px; height: 16px; }
    .header-text h1 {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      line-height: 1.2;
    }
    .header-text p {
      font-size: 11px;
      color: #aaa;
      margin-top: 1px;
    }

    /* ── Main toggle row ── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #272727;
    }
    .toggle-label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .toggle-label span:first-child {
      font-size: 13px;
      font-weight: 500;
      color: #f1f1f1;
    }
    .toggle-label span:last-child {
      font-size: 11px;
      color: #888;
    }

    /* Toggle switch */
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #3f3f3f;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .slider { background: #ff3232; }
    input:checked + .slider::before { transform: translateX(18px); }

    /* ── Status bar ── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 10px 16px;
      border-bottom: 1px solid #272727;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #888;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .status-dot.active { background: #2ecc71; }
    .status-text {
      font-size: 11px;
      color: #888;
      transition: color 0.2s;
    }
    .status-text.active { color: #2ecc71; }

    /* ── Reload notice (hidden by default) ── */
    .reload-notice {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #272727;
    }
    .reload-notice.visible { display: flex; }
    .reload-notice span {
      font-size: 11px;
      color: #f0c040;
      flex: 1;
    }
    .reload-btn {
      font-size: 11px;
      font-weight: 600;
      color: #fff;
      background: #333;
      border: none;
      border-radius: 4px;
      padding: 4px 9px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .reload-btn:hover { background: #444; }

    /* ── Footer ── */
    .footer {
      padding: 9px 16px;
      font-size: 10px;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>YouTube Classic Volume</h1>
      <p>Restore bottom-left volume control</p>
    </div>
  </div>

  <div class="toggle-row">
    <div class="toggle-label">
      <span>Classic volume position</span>
      <span>Move volume to the left side</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="enableToggle" checked />
      <span class="slider"></span>
    </label>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Checking…</span>
  </div>

  <div class="reload-notice" id="reloadNotice">
    <span>⚠ Reload the YouTube tab to apply changes</span>
    <button class="reload-btn" id="reloadBtn">Reload</button>
  </div>

  <div class="footer">v1.1.0 · YouTube Classic Volume</div>

  <script src="popup.js"></script>
</body>
</html>
